# ═══════════════════════════════════════════════════════════════
#  GMS-DC — Configuration de déploiement Netlify
#  TanStack Start (sortie statique dans dist/)
# ═══════════════════════════════════════════════════════════════

[build]
  command         = "bun run build"
  publish         = "dist"

[build.environment]
  NODE_VERSION  = "20"
  BUN_VERSION   = "1"
  NITRO_PRESET  = "netlify"

# ── En-têtes de sécurité ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache long terme pour les assets versionnés ────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Fallback SPA ───────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
